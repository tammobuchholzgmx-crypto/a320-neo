<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoreboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%86%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root{
    --bg:#16171A;
    --panel:#1E2025;
    --panel-2:#242730;
    --line:#33363E;
    --text:#EDEDEC;
    --text-dim:#9B9EA6;
    --blue:#4C6FFF;
    --gold:#E8B93F;
    --green:#3FBF7F;
    --red:#E2584D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:28px 20px 80px;
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:22px;
    gap:12px;
  }
  h1{
    font-family:'Archivo',sans-serif;
    font-weight:800;
    font-size:26px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .month-label{
    color:var(--text-dim);
    font-size:14px;
  }

  /* Player picker */
  #who{
    display:flex;
    gap:8px;
    margin-bottom:20px;
  }
  #who button{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    padding:10px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter';
  }
  #who button.active{
    border-color:var(--blue);
    background:var(--panel-2);
  }

  /* Scoreboard cards */
  .board{
    display:grid;
    grid-template-columns:repeat(3, minmax(0,1fr));
    gap:8px;
    margin-bottom:24px;
  }
  @media (max-width: 420px){
    .board{ gap:6px; }
    .card{ padding:12px 8px; }
    .p-score{ font-size:24px; }
    .p-name{ font-size:12px; }
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px 12px;
    position:relative;
    overflow:hidden;
  }
  .card.rank-1{border-color:var(--gold);}
  .rank-tag{
    font-size:11px;
    color:var(--text-dim);
    margin-bottom:6px;
  }
  .card.rank-1 .rank-tag{color:var(--gold);}
  .p-name{
    font-size:14px;
    font-weight:600;
    margin-bottom:8px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .p-score{
    font-family:'Archivo',sans-serif;
    font-weight:800;
    font-size:32px;
    line-height:1;
    letter-spacing:-0.02em;
  }
  .p-score .unit{font-size:13px;color:var(--text-dim);font-family:'Inter';font-weight:500;margin-left:3px;}
  .p-meta{
    margin-top:8px;
    font-size:12px;
    color:var(--text-dim);
    display:flex;
    align-items:center;
    gap:4px;
  }
  .p-gap{
    margin-top:8px;
    font-size:12px;
    color:var(--text-dim);
  }
  .rank-arrow{
    font-size:11px;
    margin-left:4px;
  }
  .rank-arrow.up{color:var(--green);}
  .rank-arrow.down{color:var(--red);}
  .streak-risk{color:var(--gold);}
  @keyframes leaderFlash{
    0%{ box-shadow:0 0 0 0 rgba(232,185,63,0.6); }
    100%{ box-shadow:0 0 0 14px rgba(232,185,63,0); }
  }
  .card.rank-1.flash{ animation: leaderFlash 0.9s ease-out; }

  /* Chart */
  section.chart{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    margin-bottom:24px;
  }
  section.chart h2{
    font-size:14px;
    font-weight:600;
    margin:0 0 12px;
    color:var(--text-dim);
  }
  section.chart canvas{max-height:220px;}

  /* Stakes banner */
  .stakes{
    background:var(--panel);
    border:1px solid var(--gold);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:24px;
    font-size:13px;
    color:var(--text-dim);
    line-height:1.5;
  }
  .stakes strong{color:var(--gold);}

  /* Log entry */
  section.log{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    margin-bottom:20px;
  }
  section.log h2{
    font-size:14px;
    font-weight:600;
    margin:0 0 12px;
  }
  .cats{
    display:grid;
    grid-template-columns:1fr;
    gap:8px;
  }
  .cat-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:11px 12px;
    cursor:pointer;
    color:var(--text);
    font-family:'Inter';
    font-size:13px;
    font-weight:500;
    text-align:left;
  }
  .cat-btn:active{border-color:var(--blue);}
  .cat-btn.done{opacity:0.45;cursor:default;}
  .cat-btn.numeric{cursor:default;flex-wrap:wrap;gap:8px;}
  .numeric-input{display:flex;gap:6px;}
  .numeric-input input{
    width:78px;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:6px;
    padding:6px 8px;
    font-size:13px;
    font-family:'Inter';
  }
  .numeric-input button{
    background:var(--blue);
    color:#fff;
    border:none;
    border-radius:6px;
    padding:6px 10px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
  }
  .numeric-input button:disabled{opacity:0.4;cursor:default;}
  .cat-pts{
    color:var(--green);
    font-weight:700;
    font-size:13px;
  }
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--green);
    color:#0d1a12;
    padding:10px 18px;
    border-radius:20px;
    font-size:13px;
    font-weight:600;
    opacity:0;
    transition:opacity .2s, transform .2s;
    pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* Feed */
  section.feed h2{
    font-size:14px;
    font-weight:600;
    margin:0 0 10px;
    color:var(--text-dim);
  }
  .feed-item{
    display:flex;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .feed-item:last-child{border-bottom:none;}
  .feed-name{font-weight:600;}
  .feed-cat{color:var(--text-dim);}
  .feed-pts{color:var(--green);font-weight:700;}
  .feed-time{color:var(--text-dim);font-size:12px;margin-left:8px;}
  .del-btn{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:16px;
    cursor:pointer;
    margin-left:8px;
    padding:0 4px;
    line-height:1;
  }
  .del-btn:hover{color:var(--red);}
  .empty{color:var(--text-dim);font-size:13px;padding:16px 0;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Scoreboard</h1>
    <div class="month-label" id="monthLabel"></div>
  </header>

  <div id="who"></div>

  <div class="board" id="board"></div>

  <section class="chart">
    <h2>Punkteverlauf diesen Monat</h2>
    <canvas id="trendChart"></canvas>
  </section>

  <div class="stakes" id="stakesBanner"></div>

  <section class="log">
    <h2>Punkte eintragen</h2>
    <div class="cats" id="cats"></div>
  </section>

  <section class="feed">
    <h2>Letzte Einträge</h2>
    <div id="feed"></div>
  </section>

</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   KONFIGURATION — hier alles auf euch drei anpassen
   ============================================================ */

// Eure 3 Spieler: id = intern, name = Anzeigename
const PLAYERS = [
  { id: "p1", name: "Tammo" },
  { id: "p2", name: "Joshua" },
  { id: "p3", name: "Lennart" },
];

// Kategorien: "flat" = fester Punktwert pro Klick, "numeric" = Zahl eingeben.
// "limit": "day" = max. 1x pro Tag, "week-sunday" = nur sonntags, max. 1x pro Woche.
const CATEGORIES = [
  { id: "bett",               label: "Bett gemacht",                                type: "flat",    points: 1,  limit: "day" },
  { id: "sport",               label: "Sport",                                       type: "flat",    points: 50 },
  { id: "schritte",             label: "Schritte",                                    type: "numeric", unitLabel: "Schritte", unitSize: 1000, pointsPerUnit: 1 },
  { id: "lesen",                 label: "Lesen",                                       type: "numeric", unitLabel: "Minuten", unitSize: 10, pointsPerUnit: 10 },
  { id: "screentime_besser",     label: "Screenzeit: 30 Min weniger als letzte Woche", type: "flat",    points: 10, limit: "week-sunday" },
  { id: "screentime_ziel",       label: "Screenzeit-Wochenschnitt unter 2h",           type: "flat",    points: 50, limit: "week-sunday" },
];

// Preis, den der Monatssieger insgesamt bekommt (von den beiden anderen zusammen, informativ)
const MONTHLY_PRIZE_EUR = 15;

// Fest eingetragene Supabase-Zugangsdaten (Publishable Key ist bewusst öffentlich nutzbar)
const SUPABASE_URL = "https://dswuwwmkrjwhyzbnyvvi.supabase.co";
const SUPABASE_KEY = "sb_publishable_tGL-gO7-zsiQw5jwyzeUEA_ef_Cduao";

/* ============================================================
   Ab hier nichts mehr anfassen
   ============================================================ */

let sb = null;
let currentPlayer = localStorage.getItem("sb_current_player") || null;
let currentMonthEntries = [];
let trendChart = null;

function monthBounds(){
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), 1);
  const end = new Date(now.getFullYear(), now.getMonth()+1, 1);
  return {start: start.toISOString(), end: end.toISOString()};
}

function dateKey(d){
  return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
}

// Streak = Anzahl aufeinanderfolgender Tage mit mindestens einem Eintrag.
// Wenn heute noch nichts eingetragen wurde, zählt die Streak trotzdem ab
// gestern weiter (sie ist ja bis Mitternacht noch "am Leben"), wird aber
// als "atRisk" markiert, damit man motiviert wird, sie heute zu retten.
function computeStreak(playerId, entries){
  const days = new Set(
    entries.filter(e=> e.player_id === playerId).map(e=> dateKey(new Date(e.created_at)))
  );
  const today = new Date();
  const atRisk = !days.has(dateKey(today));
  const cursor = new Date(today);
  if(atRisk) cursor.setDate(cursor.getDate()-1); // heute noch offen, bei gestern anfangen
  let streak = 0;
  while(days.has(dateKey(cursor))){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return { count: streak, atRisk: atRisk && streak > 0 };
}

function dayBounds(){
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const end = new Date(start); end.setDate(end.getDate()+1);
  return {start, end};
}

function weekBounds(){
  const now = new Date();
  const dow = (now.getDay() + 6) % 7; // Montag = 0
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow);
  const end = new Date(start); end.setDate(end.getDate()+7);
  return {start, end};
}

function isSunday(){
  return new Date().getDay() === 0;
}

// Für Kategorien mit "limit": prüft ob heute/diese Woche schon geloggt wurde,
// bzw. ob heute überhaupt der richtige Tag dafür ist ("week-sunday").
function categoryLockState(cat){
  if(!cat.limit || !currentPlayer) return { locked: false };

  if(cat.limit === "day"){
    const {start, end} = dayBounds();
    const done = currentMonthEntries.some(e=>
      e.player_id === currentPlayer && e.category === cat.id &&
      new Date(e.created_at) >= start && new Date(e.created_at) < end
    );
    return done ? { locked: true, reason: "heute schon erledigt" } : { locked: false };
  }

  if(cat.limit === "week-sunday"){
    if(!isSunday()) return { locked: true, reason: "nur sonntags" };
    const {start, end} = weekBounds();
    const done = currentMonthEntries.some(e=>
      e.player_id === currentPlayer && e.category === cat.id &&
      new Date(e.created_at) >= start && new Date(e.created_at) < end
    );
    return done ? { locked: true, reason: "diese Woche schon erledigt" } : { locked: false };
  }

  return { locked: false };
}

function renderWho(){
  const el = document.getElementById("who");
  el.innerHTML = "";
  PLAYERS.forEach(p=>{
    const btn = document.createElement("button");
    btn.textContent = p.name;
    if(p.id === currentPlayer) btn.classList.add("active");
    btn.onclick = ()=>{
      currentPlayer = p.id;
      localStorage.setItem("sb_current_player", p.id);
      renderWho();
      renderCats();
    };
    el.appendChild(btn);
  });
}

function renderCats(){
  const el = document.getElementById("cats");
  el.innerHTML = "";
  CATEGORIES.forEach(c=>{
    if(c.type === "flat"){
      const lock = categoryLockState(c);
      const btn = document.createElement("button");
      btn.className = "cat-btn" + (lock.locked ? " done" : "");
      btn.disabled = lock.locked;
      btn.innerHTML = `<span>${c.label}${lock.locked ? " · " + lock.reason : ""}</span><span class="cat-pts">+${c.points}</span>`;
      btn.onclick = ()=> logFlat(c);
      el.appendChild(btn);
    } else {
      const row = document.createElement("div");
      row.className = "cat-btn numeric";
      row.innerHTML = `
        <span>${c.label}</span>
        <span class="numeric-input">
          <input type="number" min="0" step="1" placeholder="${c.unitLabel}" id="input-${c.id}">
          <button onclick="logNumeric('${c.id}')">Eintragen</button>
        </span>`;
      el.appendChild(row);
    }
  });
}

async function logFlat(cat){
  if(!currentPlayer){ alert("Wähl oben erst deinen Namen aus."); return; }
  const lock = categoryLockState(cat);
  if(lock.locked){ alert("Geht gerade nicht: " + lock.reason + "."); return; }
  await insertEntry(cat.id, cat.points, `+${cat.points} für ${cat.label}`);
}

async function logNumeric(catId){
  const cat = CATEGORIES.find(c=> c.id === catId);
  if(!currentPlayer){ alert("Wähl oben erst deinen Namen aus."); return; }
  const input = document.getElementById("input-"+catId);
  const value = parseInt(input.value, 10);
  if(!value || value <= 0){ alert("Trag zuerst eine Zahl ein."); return; }
  const points = Math.floor(value / cat.unitSize) * cat.pointsPerUnit;
  if(points <= 0){ alert(`Das sind noch keine ${cat.unitSize} ${cat.unitLabel} — noch keine Punkte.`); return; }
  await insertEntry(cat.id, points, `+${points} für ${value} ${cat.unitLabel}`, value);
  input.value = "";
}

async function insertEntry(categoryId, points, toastMsg, rawValue){
  const { error } = await sb.from("entries").insert({
    player_id: currentPlayer,
    category: categoryId,
    points: points,
    raw_value: rawValue ?? null
  });
  if(error){ alert("Fehler beim Speichern: " + error.message); return; }
  showToast(toastMsg);
}

async function deleteEntry(id){
  if(!confirm("Diesen Eintrag wirklich löschen?")) return;
  const { error } = await sb.from("entries").delete().eq("id", id);
  if(error){ alert("Fehler beim Löschen: " + error.message); }
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=> t.classList.remove("show"), 1800);
}

let previousRanks = {};

function renderBoard(entries){
  const totals = {};
  PLAYERS.forEach(p=> totals[p.id] = 0);
  entries.forEach(e=> totals[e.player_id] = (totals[e.player_id]||0) + e.points);

  const ranked = PLAYERS.map(p=>({...p, pts: totals[p.id]||0, streak: computeStreak(p.id, entries)}))
    .sort((a,b)=> b.pts - a.pts);

  const topScore = ranked[0].pts;
  const previousLeader = Object.keys(previousRanks).find(id=> previousRanks[id] === 0);
  const newLeaderChanged = previousLeader && previousLeader !== ranked[0].id && ranked[0].pts > 0;

  const board = document.getElementById("board");
  board.innerHTML = "";
  ranked.forEach((p, i)=>{
    const card = document.createElement("div");
    const isNewLeader = i===0 && p.pts>0;
    card.className = "card" + (isNewLeader ? " rank-1" : "") + (isNewLeader && newLeaderChanged ? " flash" : "");

    let arrowHtml = "";
    if(previousRanks[p.id] !== undefined && previousRanks[p.id] !== i){
      arrowHtml = previousRanks[p.id] > i
        ? `<span class="rank-arrow up">▲</span>`
        : `<span class="rank-arrow down">▼</span>`;
    }

    const streakHtml = p.streak.count > 0
      ? `<div class="p-meta${p.streak.atRisk ? " streak-risk" : ""}">🔥 ${p.streak.count} Tage Streak${p.streak.atRisk ? " · heute noch retten!" : ""}</div>`
      : "";
    const gapHtml = i > 0 && topScore > 0 ? `<div class="p-gap">${topScore - p.pts} Pkt bis Platz 1</div>` : "";
    card.innerHTML = `
      <div class="rank-tag">${i===0 ? "1. Platz" : (i+1)+". Platz"}${arrowHtml}</div>
      <div class="p-name">${p.name}</div>
      <div class="p-score">${p.pts}<span class="unit">Pkt</span></div>
      ${streakHtml}
      ${gapHtml}
    `;
    board.appendChild(card);
  });

  previousRanks = {};
  ranked.forEach((p, i)=> previousRanks[p.id] = i);

  const leader = ranked[0];
  const banner = document.getElementById("stakesBanner");
  if(leader && leader.pts > 0){
    banner.innerHTML = `<strong>${leader.name}</strong> liegt aktuell vorn und würde am Monatsende insgesamt ${MONTHLY_PRIZE_EUR}€ von den beiden anderen zusammen bekommen.`;
  } else {
    banner.innerHTML = `Noch keine Einträge diesen Monat. Wer am Ende vorn liegt, bekommt insgesamt ${MONTHLY_PRIZE_EUR}€ von den beiden anderen zusammen.`;
  }
}

function renderChart(entries){
  const now = new Date();
  const daysInMonth = now.getDate(); // bis heute, nicht den ganzen Monat voraus
  const labels = Array.from({length: daysInMonth}, (_, i)=> i+1);
  const colors = { p1: "#4C6FFF", p2: "#E8B93F", p3: "#3FBF7F" };

  const datasets = PLAYERS.map(p=>{
    const dailyTotals = new Array(daysInMonth).fill(0);
    entries.forEach(e=>{
      if(e.player_id !== p.id) return;
      const day = new Date(e.created_at).getDate();
      if(day <= daysInMonth) dailyTotals[day-1] += e.points;
    });
    let running = 0;
    const cumulative = dailyTotals.map(v=> running += v);
    return {
      label: p.name,
      data: cumulative,
      borderColor: colors[p.id] || "#9B9EA6",
      backgroundColor: "transparent",
      tension: 0.25,
      pointRadius: 2,
    };
  });

  const ctx = document.getElementById("trendChart");
  if(trendChart) trendChart.destroy();
  trendChart = new Chart(ctx, {
    type: "line",
    data: { labels, datasets },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: "#EDEDEC" } } },
      scales: {
        x: { ticks: { color: "#9B9EA6" }, grid: { color: "#2A2D34" } },
        y: { ticks: { color: "#9B9EA6" }, grid: { color: "#2A2D34" } },
      }
    }
  });
}

function renderFeed(entries){
  const feed = document.getElementById("feed");
  if(entries.length === 0){
    feed.innerHTML = `<div class="empty">Noch keine Einträge.</div>`;
    return;
  }
  const byId = {};
  PLAYERS.forEach(p=> byId[p.id] = p.name);
  const catLabel = {};
  CATEGORIES.forEach(c=> catLabel[c.id] = c.label);

  feed.innerHTML = entries.slice(0, 25).map(e=>{
    const d = new Date(e.created_at);
    const time = d.toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit'}) + " " + d.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
    const catText = catLabel[e.category]||e.category;
    return `<div class="feed-item">
      <div><span class="feed-name">${byId[e.player_id]||'?'}</span> <span class="feed-cat">${catText}</span></div>
      <div><span class="feed-pts">+${e.points}</span><span class="feed-time">${time}</span><button class="del-btn" onclick="deleteEntry('${e.id}')" title="Löschen">×</button></div>
    </div>`;
  }).join("");
}

async function loadAndRender(){
  const {start, end} = monthBounds();
  const { data, error } = await sb
    .from("entries")
    .select("*")
    .gte("created_at", start)
    .lt("created_at", end)
    .order("created_at", {ascending:false});
  if(error){ console.error(error); return; }
  currentMonthEntries = data;
  renderBoard(data);
  renderChart(data);
  renderFeed(data);
  renderCats();
}

function subscribeRealtime(){
  sb.channel("entries-live")
    .on("postgres_changes", {event:"*", schema:"public", table:"entries"}, ()=>{
      loadAndRender();
    })
    .subscribe();
}

async function init(){
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const now = new Date();
  document.getElementById("monthLabel").textContent =
    now.toLocaleDateString('de-DE', {month:'long', year:'numeric'});

  renderWho();
  renderCats();
  await loadAndRender();
  subscribeRealtime();
}

init();
</script>
</body>
</html>
