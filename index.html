<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Scoreboard</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16171A">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scoreboard">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%86%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root{
    --bg:#16171A;
    --panel:#1E2025;
    --panel-2:#242730;
    --line:#33363E;
    --text:#EDEDEC;
    --text-dim:#9B9EA6;
    --blue:#4C6FFF;
    --gold:#E8B93F;
    --green:#3FBF7F;
    --red:#E2584D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:28px 20px calc(80px + env(safe-area-inset-bottom));
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:14px;
    gap:12px;
    flex-wrap:wrap;
  }
  h1{
    font-family:'Archivo',sans-serif;
    font-weight:800;
    font-size:26px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .month-label{
    color:var(--text-dim);
    font-size:14px;
  }

  .ticker{
    font-size:12px;
    color:var(--text-dim);
    margin:-4px 0 16px;
    min-height:16px;
  }
  @keyframes tickerPulse{
    0%{ opacity:0; transform:translateY(-3px); }
    100%{ opacity:1; transform:translateY(0); }
  }
  .ticker.pulse{ animation: tickerPulse 0.4s ease-out; }

  /* Modal */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
  }
  .modal-overlay.show{ display:flex; }
  .modal-box{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px;
    max-width:420px;
    width:100%;
    position:relative;
    max-height:80vh;
    overflow-y:auto;
  }
  .modal-box.wide{ max-width:640px; }
  .modal-box h3{ margin:0 0 4px; font-size:16px; font-family:'Archivo'; }
  .modal-sub{ margin:0 0 14px; font-size:12px; color:var(--text-dim); }
  .modal-close{
    position:absolute;
    top:12px; right:12px;
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:20px;
    cursor:pointer;
    line-height:1;
    padding:4px;
  }
  .modal-box input{
    width:100%;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:6px;
    padding:10px;
    font-size:16px;
    font-family:'Inter';
    margin-bottom:14px;
  }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-end; }
  .modal-actions button{
    border:none;
    border-radius:6px;
    padding:9px 14px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    background:var(--panel-2);
    color:var(--text);
  }
  .modal-actions button.primary{ background:var(--blue); color:#fff; }

  /* Skeleton-Loading */
  .skel{
    background:linear-gradient(90deg, var(--panel-2) 25%, var(--line) 37%, var(--panel-2) 63%);
    background-size:400% 100%;
    animation:skelShimmer 1.4s ease infinite;
    border-radius:6px;
  }
  @keyframes skelShimmer{
    0%{ background-position:100% 50%; }
    100%{ background-position:0 50%; }
  }
  .chart-wrap{ position:relative; min-height:180px; }
  .chart-wrap #chartSkeleton{ position:absolute; inset:0; }

  /* Confetti */
  .confetti-container{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:150;
  }
  .confetti-piece{
    position:absolute;
    top:-12px;
    width:8px;
    height:14px;
    opacity:0.9;
    border-radius:2px;
    animation-name:confettiFall;
    animation-timing-function:ease-in;
    animation-fill-mode:forwards;
  }
  @keyframes confettiFall{
    to{ transform:translateY(110vh) rotate(360deg); opacity:0.3; }
  }

  /* Month archive nav */
  .month-nav{
    display:flex;
    justify-content:flex-end;
    margin-bottom:18px;
  }
  .month-nav select{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    padding:8px 10px;
    font-size:13px;
    font-family:'Inter';
  }
  .archive-notice{
    background:var(--panel);
    border:1px solid var(--blue);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:20px;
    font-size:13px;
    color:var(--text-dim);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .archive-notice button{
    background:var(--blue);
    color:#fff;
    border:none;
    border-radius:6px;
    padding:7px 12px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }

  /* Player picker */
  #who{
    display:flex;
    gap:8px;
    margin-bottom:20px;
  }
  #who button{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    padding:13px 10px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter';
  }
  #who button.active{
    border-color:var(--blue);
    background:var(--panel-2);
  }

  /* Scoreboard cards */
  .board{
    display:grid;
    grid-template-columns:repeat(3, minmax(0,1fr));
    gap:8px;
    margin-bottom:24px;
  }
  @media (max-width: 420px){
    .board{ gap:6px; }
    .card{ padding:12px 8px; }
    .p-score{ font-size:24px; }
    .p-name{ font-size:12px; }
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px 12px;
    position:relative;
    overflow:hidden;
    cursor:pointer;
  }
  .card.rank-1{border-color:var(--gold);}
  .card:active{border-color:var(--blue);}
  .rank-tag{
    font-size:11px;
    color:var(--text-dim);
    margin-bottom:6px;
  }
  .card.rank-1 .rank-tag{color:var(--gold);}
  .p-name{
    font-size:14px;
    font-weight:600;
    margin-bottom:8px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .p-score{
    font-family:'Archivo',sans-serif;
    font-weight:800;
    font-size:32px;
    line-height:1;
    letter-spacing:-0.02em;
  }
  .p-score .unit{font-size:13px;color:var(--text-dim);font-family:'Inter';font-weight:500;margin-left:3px;}
  .p-meta{
    margin-top:6px;
    font-size:11px;
    color:var(--text-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .p-gap{
    margin-top:6px;
    font-size:11px;
    color:var(--text-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .p-compare{
    margin-top:4px;
    font-size:11px;
    color:var(--text-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .p-compare.up{color:var(--green);}
  .p-compare.down{color:var(--red);}
  .rank-arrow{
    font-size:11px;
    margin-left:4px;
  }
  .rank-arrow.up{color:var(--green);}
  .rank-arrow.down{color:var(--red);}
  .streak-risk{color:var(--gold);}
  @keyframes leaderFlash{
    0%{ box-shadow:0 0 0 0 rgba(232,185,63,0.6); }
    100%{ box-shadow:0 0 0 14px rgba(232,185,63,0); }
  }
  .card.rank-1.flash{ animation: leaderFlash 0.9s ease-out; }

  /* Chart */
  section.chart{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    margin-bottom:24px;
    cursor:pointer;
  }
  section.chart:active{ border-color:var(--blue); }
  section.chart h2{
    font-size:14px;
    font-weight:600;
    margin:0 0 12px;
    color:var(--text-dim);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .chart-expand-hint{
    font-size:11px;
    font-weight:500;
    color:var(--blue);
  }
  section.chart canvas{max-height:220px;}

  /* Stakes banner */
  .stakes{
    background:var(--panel);
    border:1px solid var(--gold);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:24px;
    font-size:13px;
    color:var(--text-dim);
    line-height:1.5;
  }
  .stakes strong{color:var(--gold);}

  /* Wallet */
  section.wallet{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    margin-bottom:24px;
  }
  section.wallet h2{
    font-size:14px;
    font-weight:600;
    margin:0 0 12px;
    color:var(--text-dim);
  }
  .wallet-cards{
    display:grid;
    grid-template-columns:repeat(3, minmax(0,1fr));
    gap:8px;
    margin-bottom:6px;
  }
  @media (max-width: 420px){
    .wallet-cards{ grid-template-columns:minmax(0, 1fr); }
  }
  .wallet-card{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px;
  }
  .wallet-name{font-size:12px;color:var(--text-dim);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wallet-badges{margin-bottom:8px;}
  .wallet-badges div{
    font-size:11px;
    color:var(--text-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    line-height:1.5;
  }
  .wallet-bal{
    font-family:'Archivo',sans-serif;
    font-weight:800;
    font-size:19px;
    margin-bottom:8px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .wallet-bal.neg{color:var(--red);}
  .wallet-spend-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--text-dim);
    border-radius:6px;
    padding:9px 10px;
    font-size:13px;
    cursor:pointer;
    width:100%;
  }
  .spend-form{
    display:none;
    flex-direction:column;
    gap:6px;
    margin-top:8px;
  }
  .spend-form input{
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:6px;
    padding:9px 8px;
    font-size:16px;
    font-family:'Inter';
  }
  .spend-form button{
    background:var(--blue);
    color:#fff;
    border:none;
    border-radius:6px;
    padding:9px 10px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }

  /* Log entry */
  section.log{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    margin-bottom:20px;
  }
  section.log h2{
    font-size:14px;
    font-weight:600;
    margin:0 0 12px;
  }
  .cats{
    display:grid;
    grid-template-columns:minmax(0, 1fr);
    gap:8px;
  }
  .cat-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:11px 12px;
    cursor:pointer;
    color:var(--text);
    font-family:'Inter';
    font-size:13px;
    font-weight:500;
    text-align:left;
  }
  .cat-btn:active{border-color:var(--blue);}
  .cat-btn.done{opacity:0.45;cursor:default;}
  .cat-btn.numeric{cursor:default;}
  .cat-btn span:first-child{
    flex:1 1 auto;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    margin-right:8px;
  }
  .numeric-input{display:flex;gap:6px;flex-shrink:0;}
  .numeric-input input{
    width:64px;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:6px;
    padding:8px 8px;
    font-size:16px;
    font-family:'Inter';
  }
  .numeric-input button{
    background:var(--blue);
    color:#fff;
    border:none;
    border-radius:6px;
    padding:8px 12px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .numeric-input button:disabled{opacity:0.4;cursor:default;}
  .cat-pts{
    color:var(--green);
    font-weight:700;
    font-size:13px;
  }
  .toast{
    position:fixed;
    bottom:calc(24px + env(safe-area-inset-bottom));
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--green);
    color:#0d1a12;
    padding:10px 18px;
    border-radius:20px;
    font-size:13px;
    font-weight:600;
    opacity:0;
    transition:opacity .2s, transform .2s;
    pointer-events:none;
    z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* Feed */
  section.feed h2{
    font-size:14px;
    font-weight:600;
    margin:0 0 10px;
    color:var(--text-dim);
  }
  section.feed h2.feed-toggle{
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:0;
    padding:4px 0;
    user-select:none;
  }
  .feed-item{
    display:flex;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .feed-item:last-child{border-bottom:none;}
  .feed-name{font-weight:600;}
  .feed-cat{color:var(--text-dim);}
  .feed-pts{color:var(--green);font-weight:700;}
  .feed-pts.neg{color:var(--red);}
  .feed-time{color:var(--text-dim);font-size:12px;margin-left:8px;}
  .del-btn{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:16px;
    cursor:pointer;
    margin-left:8px;
    padding:0 4px;
    line-height:1;
  }
  .del-btn:hover{color:var(--red);}
  .edit-btn{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:14px;
    cursor:pointer;
    margin-left:6px;
    padding:0 4px;
    line-height:1;
  }
  .edit-btn:hover{color:var(--blue);}
  .empty{color:var(--text-dim);font-size:13px;padding:16px 0;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Scoreboard</h1>
    <div class="month-label" id="monthLabel"></div>
  </header>

  <div class="ticker" id="ticker"></div>

  <div class="month-nav">
    <select id="monthSelect" onchange="onMonthSelect()"></select>
  </div>

  <div class="archive-notice" id="archiveNotice" style="display:none">
    <span>Du siehst einen vergangenen Monat an (nur Ansicht).</span>
    <button onclick="backToLive()">Zurück zu heute</button>
  </div>

  <div id="who"></div>

  <div class="board" id="board">
    <div class="card"><div class="skel" style="width:50%;height:10px;margin-bottom:10px;"></div><div class="skel" style="width:70%;height:14px;margin-bottom:10px;"></div><div class="skel" style="width:60%;height:26px;"></div></div>
    <div class="card"><div class="skel" style="width:50%;height:10px;margin-bottom:10px;"></div><div class="skel" style="width:70%;height:14px;margin-bottom:10px;"></div><div class="skel" style="width:60%;height:26px;"></div></div>
    <div class="card"><div class="skel" style="width:50%;height:10px;margin-bottom:10px;"></div><div class="skel" style="width:70%;height:14px;margin-bottom:10px;"></div><div class="skel" style="width:60%;height:26px;"></div></div>
  </div>

  <section class="chart" onclick="openChartModal()">
    <h2>
      <span id="chartTitle">Punkteverlauf</span>
      <span class="chart-expand-hint">Details</span>
    </h2>
    <div class="chart-wrap">
      <div class="skel" id="chartSkeleton"></div>
      <canvas id="trendChart"></canvas>
    </div>
  </section>

  <div class="stakes" id="stakesBanner"></div>

  <section class="log" id="logSection">
    <h2>Punkte eintragen</h2>
    <div class="cats" id="cats"></div>
  </section>

  <section class="wallet">
    <h2>Guthaben</h2>
    <div class="wallet-cards" id="walletCards">
      <div class="wallet-card"><div class="skel" style="width:60%;height:10px;margin-bottom:8px;"></div><div class="skel" style="width:70%;height:18px;margin-bottom:8px;"></div><div class="skel" style="width:100%;height:28px;"></div></div>
      <div class="wallet-card"><div class="skel" style="width:60%;height:10px;margin-bottom:8px;"></div><div class="skel" style="width:70%;height:18px;margin-bottom:8px;"></div><div class="skel" style="width:100%;height:28px;"></div></div>
      <div class="wallet-card"><div class="skel" style="width:60%;height:10px;margin-bottom:8px;"></div><div class="skel" style="width:70%;height:18px;margin-bottom:8px;"></div><div class="skel" style="width:100%;height:28px;"></div></div>
    </div>
    <div id="walletLog"></div>
  </section>

  <section class="feed">
    <h2 class="feed-toggle" onclick="toggleFeed()">Letzte Einträge <span id="feedToggleIcon">▸</span></h2>
    <div id="feed" style="display:none"></div>
  </section>

</div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
  <div class="modal-box" id="modalBox">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
/* ============================================================
   KONFIGURATION — hier alles auf euch drei anpassen
   ============================================================ */

// Eure 3 Spieler: id = intern, name = Anzeigename
const PLAYERS = [
  { id: "p1", name: "Tammo" },
  { id: "p2", name: "Joshua" },
  { id: "p3", name: "Lennart" },
];

// Kategorien: "flat" = fester Punktwert pro Klick, "numeric" = Zahl eingeben.
// "limit": "day" = max. 1x pro Tag, "week-sunday" = nur sonntags, max. 1x pro Woche.
const CATEGORIES = [
  { id: "bett",               label: "Bett gemacht",                                  type: "flat",    points: 1,  limit: "day" },
  { id: "cardio",              label: "Cardio",                                        type: "numeric", unitLabel: "Minuten", unitSize: 10, pointsPerUnit: 10 },
  { id: "sport",                label: "Sport",                                        type: "flat",    points: 60 },
  { id: "dehnen",                label: "Dehnen",                                       type: "flat",    points: 20, limit: "day" },
  { id: "schritte",               label: "Schritte (in Tausend)",         type: "numeric", unitLabel: "Tausend", unitSize: 1, pointsPerUnit: 1, displayMultiplier: 1000, displayUnitLabel: "Schritte" },
  { id: "lesen",                   label: "Lesen",                                       type: "numeric", unitLabel: "Minuten", unitSize: 1, pointsPerUnit: 1 },
  { id: "screentime_besser",        label: "Social Media: 30 Min weniger als letzte Woche", type: "flat",  points: 10, limit: "week-sunday" },
  { id: "screentime_ziel",          label: "Social-Media-Wochenschnitt unter 2h",          type: "flat",  points: 50, limit: "week-sunday" },
];

// Preis, den der Monatssieger insgesamt bekommt (von den beiden anderen zusammen)
const MONTHLY_PRIZE_EUR = 15;

// Feste Akzentfarbe je Spieler — an einer Stelle definiert, überall verwendet
// (Chart, Karten, Badges, Namens-Auswahl), damit es konsistent bleibt.
const PLAYER_COLORS = { p1: "#4C6FFF", p2: "#E8B93F", p3: "#3FBF7F" };

// Kleines, einheitliches Icon-Set (inline SVG) statt Emojis — sieht auf jedem

function pad2(n){ return String(n).padStart(2, "0"); }

function monthKey(d){
  return d.getFullYear() + "-" + pad2(d.getMonth()+1);
}

function dateKey(d){
  return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
}

function daysInMonthOf(year, monthIndex0){
  return new Date(year, monthIndex0+1, 0).getDate();
}

function formatEuro(v){
  const sign = v < 0 ? "-" : "";
  return sign + Math.abs(v).toLocaleString('de-DE', {minimumFractionDigits:2, maximumFractionDigits:2}) + " €";
}

// Streak = Anzahl aufeinanderfolgender Tage mit mindestens einem Eintrag,
// über ALLE Monate hinweg (damit die Streak am Monatswechsel nicht fälschlich abreißt).
// Wenn heute noch nichts eingetragen wurde, zählt die Streak trotzdem ab
// gestern weiter (sie ist ja bis Mitternacht noch "am Leben"), wird aber
// als "atRisk" markiert.
function computeStreak(playerId, entriesAllTime){
  const days = new Set(
    entriesAllTime.filter(e=> e.player_id === playerId).map(e=> dateKey(new Date(e.created_at)))
  );
  const today = new Date();
  const atRisk = !days.has(dateKey(today));
  const cursor = new Date(today);
  if(atRisk) cursor.setDate(cursor.getDate()-1);
  let streak = 0;
  while(days.has(dateKey(cursor))){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return { count: streak, atRisk: atRisk && streak > 0 };
}

function dayBounds(){
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const end = new Date(start); end.setDate(end.getDate()+1);
  return {start, end};
}

function weekBounds(){
  const now = new Date();
  const dow = (now.getDay() + 6) % 7; // Montag = 0
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow);
  const end = new Date(start); end.setDate(end.getDate()+7);
  return {start, end};
}

function isSunday(){
  return new Date().getDay() === 0;
}

// Für Kategorien mit "limit": prüft ob heute/diese Woche schon geloggt wurde,
// bzw. ob heute überhaupt der richtige Tag dafür ist ("week-sunday").
function categoryLockState(cat){
  if(!cat.limit || !currentPlayer) return { locked: false };

  if(cat.limit === "day"){
    const {start, end} = dayBounds();
    const done = currentMonthEntries.some(e=>
      e.player_id === currentPlayer && e.category === cat.id &&
      new Date(e.created_at) >= start && new Date(e.created_at) < end
    );
    return done ? { locked: true, reason: "heute schon erledigt" } : { locked: false };
  }

  if(cat.limit === "week-sunday"){
    if(!isSunday()) return { locked: true, reason: "nur sonntags" };
    const {start, end} = weekBounds();
    const done = currentMonthEntries.some(e=>
      e.player_id === currentPlayer && e.category === cat.id &&
      new Date(e.created_at) >= start && new Date(e.created_at) < end
    );
    return done ? { locked: true, reason: "diese Woche schon erledigt" } : { locked: false };
  }

  return { locked: false };
}

// Ermittelt Sieger eines Monats aus einer Liste von Einträgen (nur dieser Monat).
// Bei Gleichstand an der Spitze gibt es keinen eindeutigen Sieger.
function monthWinner(monthEntries){
  const totals = {};
  PLAYERS.forEach(p=> totals[p.id] = 0);
  monthEntries.forEach(e=> totals[e.player_id] = (totals[e.player_id]||0) + e.points);
  const max = Math.max(...PLAYERS.map(p=> totals[p.id]));
  if(max <= 0) return { winner: null, tie: false, totals };
  const topPlayers = PLAYERS.filter(p=> totals[p.id] === max);
  return topPlayers.length === 1
    ? { winner: topPlayers[0], tie: false, totals }
    : { winner: null, tie: true, totals };
}

// Guthaben je Spieler: +15€ für jeden abgeschlossenen Monat, den er gewonnen hat,
// minus alles, was er/sie über "Ausgeben" bereits abgezogen hat.
function computeWallets(){
  const balances = {};
  PLAYERS.forEach(p=> balances[p.id] = 0);
  const nowKey = monthKey(new Date());
  const monthsSeen = new Set(allEntries.map(e=> monthKey(new Date(e.created_at))));
  monthsSeen.forEach(mk=>{
    if(mk === nowKey) return; // laufender Monat ist noch nicht abgeschlossen
    const monthEntries = allEntries.filter(e=> monthKey(new Date(e.created_at)) === mk);
    const { winner } = monthWinner(monthEntries);
    if(winner) balances[winner.id] += MONTHLY_PRIZE_EUR;
  });
  allSpends.forEach(s=>{
    if(balances[s.player_id] !== undefined) balances[s.player_id] -= Number(s.amount);
  });
  return balances;
}

// Achievements: Anzahl gewonnener (abgeschlossener) Monate + bester Einzeltag, je Spieler.
function computeAchievements(){
  const wins = {};
  const bestDay = {};
  PLAYERS.forEach(p=>{ wins[p.id] = 0; bestDay[p.id] = 0; });

  const nowKey = monthKey(new Date());
  const monthsSeen = new Set(allEntries.map(e=> monthKey(new Date(e.created_at))));
  monthsSeen.forEach(mk=>{
    if(mk === nowKey) return;
    const monthEntries = allEntries.filter(e=> monthKey(new Date(e.created_at)) === mk);
    const { winner } = monthWinner(monthEntries);
    if(winner) wins[winner.id]++;
  });

  const dayTotals = {};
  PLAYERS.forEach(p=> dayTotals[p.id] = {});
  allEntries.forEach(e=>{
    const dk = dateKey(new Date(e.created_at));
    dayTotals[e.player_id][dk] = (dayTotals[e.player_id][dk] || 0) + e.points;
  });
  PLAYERS.forEach(p=>{
    const vals = Object.values(dayTotals[p.id]);
    bestDay[p.id] = vals.length ? Math.max(...vals) : 0;
  });

  return { wins, bestDay };
}

// Punktesumme des Vormonats je Spieler, für den "vs. letzter Monat"-Vergleich.
function previousMonthTotals(){
  const now = new Date();
  const prevDate = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const prevKey = monthKey(prevDate);
  const prevEntries = allEntries.filter(e=> monthKey(new Date(e.created_at)) === prevKey);
  const totals = {};
  PLAYERS.forEach(p=> totals[p.id] = 0);
  prevEntries.forEach(e=> totals[e.player_id] += e.points);
  return { totals, hasData: prevEntries.length > 0 };
}

// Punkte, die heute (Kalendertag) bereits gemacht wurden, je Spieler.
function todayTotals(){
  const {start, end} = dayBounds();
  const totals = {};
  PLAYERS.forEach(p=> totals[p.id] = 0);
  allEntries.forEach(e=>{
    const d = new Date(e.created_at);
    if(d >= start && d < end) totals[e.player_id] += e.points;
  });
  return totals;
}

// Zählt eine Zahl sanft von "from" zu "to" hoch (bzw. runter), statt zu springen.
function animateNumber(el, from, to, duration){
  if(!el) return;
  if(from === to){ el.textContent = to; return; }
  const start = performance.now();
  function tick(now){
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3); // ease-out
    el.textContent = Math.round(from + (to - from) * eased);
    if(t < 1) requestAnimationFrame(tick);
    else el.textContent = to;
  }
  requestAnimationFrame(tick);
}

function relativeTime(date){
  const mins = Math.floor((Date.now() - date.getTime()) / 60000);
  if(mins < 1) return "gerade eben";
  if(mins < 60) return `vor ${mins} Min`;
  const hours = Math.floor(mins / 60);
  if(hours < 24) return `vor ${hours} Std`;
  const days = Math.floor(hours / 24);
  return `vor ${days} Tag${days > 1 ? "en" : ""}`;
}

function updateTicker(){
  const el = document.getElementById("ticker");
  if(!el) return;
  if(allEntries.length === 0){ el.textContent = ""; lastTickerEntryId = null; return; }

  const latest = [...allEntries].sort((a,b)=> new Date(b.created_at) - new Date(a.created_at))[0];
  const byId = {}; PLAYERS.forEach(p=> byId[p.id] = p.name);
  const catLabel = {}; CATEGORIES.forEach(c=> catLabel[c.id] = c.label);

  el.textContent = `${byId[latest.player_id] || "?"}: +${latest.points} ${catLabel[latest.category] || latest.category} · ${relativeTime(new Date(latest.created_at))}`;

  if(latest.id !== lastTickerEntryId){
    lastTickerEntryId = latest.id;
    el.classList.remove("pulse");
    void el.offsetWidth; // Reflow erzwingen, damit die Animation neu startet
    el.classList.add("pulse");
  }
}

  const flagKey = "celebrated_" + prevKey;

  if(!winner) return; // Gleichstand — nichts zu feiern

  const entries = lastViewedEntries.filter(e=> e.player_id === playerId);

  const totalsByCategory = {};

// Bearbeiten geht nur bei numerischen Kategorien (Lesen, Schritte, Cardio) —
// bei festen Kategorien (Sport, Bett gemacht, ...) steht der Punktwert fest,
// da gibt's nichts zu bearbeiten außer Löschen.
function openEditModal(entryId){
  const entry = allEntries.find(e=> e.id === entryId);
  if(!entry) return;
  const cat = CATEGORIES.find(c=> c.id === entry.category);
  if(!cat || cat.type !== "numeric") return;

  const multiplier = cat.displayMultiplier || 1;
  const currentValue = entry.raw_value != null
    ? entry.raw_value / multiplier
    : Math.round((entry.points / cat.pointsPerUnit) * cat.unitSize);

  openModal(`
    <h3>Eintrag bearbeiten</h3>
    <p class="modal-sub">${cat.label}</p>
    <input type="number" min="0" step="1" id="editValue" value="${currentValue}" placeholder="${cat.unitLabel}">
    <div class="modal-actions">
      <button onclick="closeModal()">Abbrechen</button>
      <button class="primary" onclick="saveEditEntry('${entryId}')">Speichern</button>
    </div>
  `);
}

async function saveEditEntry(entryId){
  const entry = allEntries.find(e=> e.id === entryId);
  const cat = CATEGORIES.find(c=> c.id === entry.category);
  const value = parseFloat((document.getElementById("editValue").value || "").replace(",", "."));
  if(!value || value <= 0){ alert("Trag einen gültigen Wert ein."); return; }

  const points = Math.floor(value / cat.unitSize) * cat.pointsPerUnit;
  if(points <= 0){ alert(`Das sind noch keine ${cat.unitSize} ${cat.unitLabel}.`); return; }
  const multiplier = cat.displayMultiplier || 1;
  const rawValue = value * multiplier;

  const { error } = await sb.from("entries").update({ points, raw_value: rawValue }).eq("id", entryId);
  if(error){ alert("Fehler beim Speichern: " + error.message); return; }
  closeModal();
  showToast("Eintrag aktualisiert");
  loadAndRender();
}

async function logFlat(cat){
  if(!currentPlayer){ alert("Wähl oben erst deinen Namen aus."); return; }
  const lock = categoryLockState(cat);
  if(lock.locked){ alert("Geht gerade nicht: " + lock.reason + "."); return; }
  await insertEntry(cat.id, cat.points, `+${cat.points} für ${cat.label}`);
}

async function logNumeric(catId){
  const cat = CATEGORIES.find(c=> c.id === catId);
  if(!currentPlayer){ alert("Wähl oben erst deinen Namen aus."); return; }
  const input = document.getElementById("input-"+catId);
  const value = parseFloat((input.value || "").replace(",", "."));
  if(!value || value <= 0){ alert("Trag zuerst eine Zahl ein."); return; }
  const points = Math.floor(value / cat.unitSize) * cat.pointsPerUnit;
  if(points <= 0){ alert(`Das sind noch keine ${cat.unitSize} ${cat.unitLabel} — noch keine Punkte.`); return; }
  const multiplier = cat.displayMultiplier || 1;
  const displayValue = value * multiplier;
  const displayUnit = cat.displayUnitLabel || cat.unitLabel;
  await insertEntry(cat.id, points, `+${points} für ${displayValue.toLocaleString('de-DE')} ${displayUnit}`, displayValue);
  input.value = "";
}

  const { wins, bestDay } = computeAchievements();
  const byId = {}; PLAYERS.forEach(p=> byId[p.id] = p.name);

  const cardsEl = document.getElementById("walletCards");
  cardsEl.innerHTML = PLAYERS.map(p=>{
    const bal = balances[p.id] || 0;
    return `<div class="wallet-card" style="border-left:3px solid ${PLAYER_COLORS[p.id]}">
      <div class="wallet-name">${p.name}</div>
      <div class="wallet-bal${bal < 0 ? " neg" : ""}">${formatEuro(bal)}</div>
      <div class="wallet-badges"><div>${ICONS.medal} ${wins[p.id]} Sieg${wins[p.id] === 1 ? "" : "e"}</div><div>${ICONS.trend} Bester Tag ${bestDay[p.id]}</div></div>
      <button class="wallet-spend-btn" onclick="toggleSpendForm('${p.id}')">Ausgeben</button>
      <div class="spend-form" id="spend-form-${p.id}">
        <input type="number" step="0.01" min="0" placeholder="€ Betrag" id="spend-amount-${p.id}">
        <input type="text" placeholder="Wofür? (optional)" id="spend-note-${p.id}">
        <button onclick="spendMoney('${p.id}')">Bestätigen</button>
      </div>
    </div>`;
  }).join("");

  const logEl = document.getElementById("walletLog");
  if(allSpends.length === 0){
    logEl.innerHTML = `<div class="empty">Noch nichts ausgegeben.</div>`;
    return;
  }
  const sorted = [...allSpends].sort((a,b)=> new Date(b.created_at) - new Date(a.created_at));
  logEl.innerHTML = sorted.slice(0, 15).map(s=>{
    const d = new Date(s.created_at);
    const time = d.toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit'});
    return `<div class="feed-item">
      <div><span class="feed-name">${byId[s.player_id]||'?'}</span> <span class="feed-cat">${s.note || 'Ausgegeben'}</span></div>
      <div><span class="feed-pts neg">-${formatEuro(s.amount).replace('-','')}</span><span class="feed-time">${time}</span><button class="del-btn" onclick="deleteSpend('${s.id}')" title="Löschen">×</button></div>
    </div>`;
  }).join("");
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=> t.classList.remove("show"), 1800);
}

// Rang-Reihenfolge auf Basis der Punkte VOR heute (innerhalb des Monats) —
// das ist die stabile Vergleichsbasis für den Auf/Ab-Pfeil, damit er den
// ganzen Tag über konsistent bleibt statt nur kurz nach einer Änderung.
function dayStartRanking(entries){
  const {start} = dayBounds();
  const totals = {};
  PLAYERS.forEach(p=> totals[p.id] = 0);
  entries.forEach(e=>{
    if(new Date(e.created_at) < start) totals[e.player_id] += e.points;
  });
  const order = PLAYERS.map(p=> ({ id: p.id, pts: totals[p.id] })).sort((a,b)=> b.pts - a.pts);
  const allZero = order.every(p=> p.pts === 0);
  const ranks = {};
  order.forEach((p, i)=> ranks[p.id] = i);
  return { ranks, allZero };
}

function renderBoard(entries, isLive){
  const totals = {};
  PLAYERS.forEach(p=> totals[p.id] = 0);
  entries.forEach(e=> totals[e.player_id] = (totals[e.player_id]||0) + e.points);

  const ranked = PLAYERS.map(p=>({
    ...p,
    pts: totals[p.id] || 0,
    streak: isLive ? computeStreak(p.id, allEntries) : null,
  })).sort((a,b)=> b.pts - a.pts);

  const topScore = ranked[0].pts;
  const tiedAtTop = topScore > 0 && ranked.filter(p=> p.pts === topScore).length > 1;

  let newLeaderChanged = false;
  let prevMonth = null;
  let todayPts = null;
  let dayStart = null;
  if(isLive){
    const previousLeader = Object.keys(previousRanks).find(id=> previousRanks[id] === 0);
    newLeaderChanged = !!previousLeader && previousLeader !== ranked[0].id && topScore > 0 && !tiedAtTop;
    prevMonth = previousMonthTotals();
    todayPts = todayTotals();
    dayStart = dayStartRanking(entries);
  }

  const board = document.getElementById("board");
  board.innerHTML = "";
  ranked.forEach((p, i)=>{
    const card = document.createElement("div");
    const isSoleLeader = i === 0 && p.pts > 0 && !tiedAtTop;
    card.className = "card" + (isSoleLeader ? " rank-1" : "") + (isSoleLeader && newLeaderChanged ? " flash" : "");
    card.style.borderLeft = `3px solid ${PLAYER_COLORS[p.id] || "var(--line)"}`;
    card.onclick = ()=> openPlayerBreakdown(p.id);

    let extraHtml = "";
    if(isLive){
      let arrowHtml = "";
      if(dayStart && !dayStart.allZero && dayStart.ranks[p.id] !== i){
        arrowHtml = dayStart.ranks[p.id] > i
          ? `<span class="rank-arrow up">▲</span>`
          : `<span class="rank-arrow down">▼</span>`;
      }
      const streakHtml = p.streak && p.streak.count > 0
        ? `<div class="p-meta${p.streak.atRisk ? " streak-risk" : ""}">${ICONS.flame} ${p.streak.count} Tage${p.streak.atRisk ? " " + ICONS.warn : ""}</div>`
        : "";
      const gapHtml = i > 0 && topScore > 0 ? `<div class="p-gap">${topScore - p.pts} bis Platz 1</div>` : "";
      let compareHtml = "";
      if(prevMonth && prevMonth.hasData){
        const delta = p.pts - prevMonth.totals[p.id];
        const dir = delta > 0 ? "up" : delta < 0 ? "down" : "";
        const sign = delta > 0 ? "+" : "";
        compareHtml = `<div class="p-compare ${dir}">${sign}${delta} vs. Vormonat</div>`;
      }
      card.dataset.arrow = arrowHtml;
      const todayHtml = `<div class="p-meta">${ICONS.sun} Heute ${todayPts[p.id]}</div>`;
      extraHtml = todayHtml + streakHtml + gapHtml + compareHtml;
      card.innerHTML = `
        <div class="rank-tag">${i===0 ? "1. Platz" : (i+1)+". Platz"}${arrowHtml}</div>
        <div class="p-name" style="color:${PLAYER_COLORS[p.id] || "var(--text)"}">${p.name}</div>
        <div class="p-score"><span class="num" id="score-${p.id}">0</span><span class="unit">Pkt</span></div>
        ${extraHtml}
      `;
    } else {
      const winnerTag = isSoleLeader ? `<div class="p-meta">${ICONS.trophy} Gewinner</div>` : "";
      card.innerHTML = `
        <div class="rank-tag">${i===0 ? "1. Platz" : (i+1)+". Platz"}</div>
        <div class="p-name" style="color:${PLAYER_COLORS[p.id] || "var(--text)"}">${p.name}</div>
        <div class="p-score"><span class="num" id="score-${p.id}">0</span><span class="unit">Pkt</span></div>
        ${winnerTag}
      `;
    }
    board.appendChild(card);

    const scoreEl = document.getElementById(`score-${p.id}`);
    const from = displayedScores[p.id] ?? 0;
    animateNumber(scoreEl, from, p.pts, 600);
    displayedScores[p.id] = p.pts;
  });

  if(isLive){
    previousRanks = {};
    ranked.forEach((p, i)=> previousRanks[p.id] = i);
  }

  const banner = document.getElementById("stakesBanner");
  if(isLive){
    if(tiedAtTop){
      const names = ranked.filter(p=> p.pts === topScore).map(p=> p.name).join(" & ");
      banner.innerHTML = `Gleichstand: <strong>${names}</strong> — ${MONTHLY_PRIZE_EUR}€ noch offen.`;
    } else if(topScore > 0){
      const second = ranked[1], third = ranked[2];
      banner.innerHTML = `<strong>${ranked[0].name}</strong> führt · +${MONTHLY_PRIZE_EUR}€ (${third.name} -10€, ${second.name} -5€)`;
    } else {
      banner.innerHTML = `Noch keine Einträge. Sieger bekommt ${MONTHLY_PRIZE_EUR}€.`;
    }
  } else {
    if(tiedAtTop){
      const names = ranked.filter(p=> p.pts === topScore).map(p=> p.name).join(" & ");
      banner.innerHTML = `Gleichstand: <strong>${names}</strong> — ${MONTHLY_PRIZE_EUR}€ nicht vergeben.`;
    } else if(topScore > 0){
      const second = ranked[1], third = ranked[2];
      banner.innerHTML = `<strong>${ranked[0].name}</strong> war Sieger mit ${topScore} Pkt · +${MONTHLY_PRIZE_EUR}€ (${third.name} -10€, ${second.name} -5€)`;
    } else {
      banner.innerHTML = `Keine Einträge in diesem Monat.`;
    }
  }
}

// Baut Labels + Datensätze für den Punkteverlauf — von der kleinen Startseiten-
// Vorschau UND vom großen Modal-Chart genutzt, damit beide immer exakt
// dieselben Daten zeigen.
function buildChartDatasets(entries, viewedDate, isLive){
  const daysInMonth = isLive ? new Date().getDate() : daysInMonthOf(viewedDate.getFullYear(), viewedDate.getMonth());
  const labels = Array.from({length: daysInMonth}, (_, i)=> i+1);

  const datasets = PLAYERS.map(p=>{
    const dailyTotals = new Array(daysInMonth).fill(0);
    entries.forEach(e=>{
      if(e.player_id !== p.id) return;
      const day = new Date(e.created_at).getDate();
      if(day <= daysInMonth) dailyTotals[day-1] += e.points;
    });
    let running = 0;
    const cumulative = dailyTotals.map(v=> running += v);
    return {
      label: p.name,
      data: cumulative,
      borderColor: PLAYER_COLORS[p.id] || "#9B9EA6",
      backgroundColor: "transparent",
      tension: 0.25,
      pointRadius: 2,
    };
  });

  return { labels, datasets };
}

function renderChart(entries, viewedDate, isLive){
  const { labels, datasets } = buildChartDatasets(entries, viewedDate, isLive);

  const ctx = document.getElementById("trendChart");
  if(trendChart) trendChart.destroy();
  trendChart = new Chart(ctx, {
    type: "line",
    data: { labels, datasets },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: "#EDEDEC" } } },
      scales: {
        x: { ticks: { color: "#9B9EA6" }, grid: { color: "#2A2D34" } },
        y: { ticks: { color: "#9B9EA6" }, grid: { color: "#2A2D34" } },
      }
    }
  });

  const skel = document.getElementById("chartSkeleton");
  if(skel) skel.style.display = "none";
}

function toggleFeed(){
  const el = document.getElementById("feed");
  const icon = document.getElementById("feedToggleIcon");
  const show = el.style.display === "none";
  el.style.display = show ? "" : "none";
  icon.textContent = show ? "▾" : "▸";
}

// Klick auf den Chart: gleiche Daten, aber größer und übersichtlicher in
// einem eigenen Fenster. Bewusst nur hier drin — die Startseite bleibt schlank.
function openChartModal(){
  if(!lastViewedDate) return;

  const { labels, datasets } = buildChartDatasets(lastViewedEntries, lastViewedDate, lastViewedIsLive);
  const bigDatasets = datasets.map(ds=> ({ ...ds, pointRadius: 4, borderWidth: 3 }));
  const title = lastViewedIsLive
    ? "Punkteverlauf diesen Monat"
    : "Punkteverlauf " + lastViewedDate.toLocaleDateString('de-DE', {month:'long', year:'numeric'});

  openModal(`
    <h3>${title}</h3>
    <canvas id="bigChart" style="max-height:340px;"></canvas>
  `, true);

  const ctx = document.getElementById("bigChart");
  bigChartInstance = new Chart(ctx, {
    type: "line",
    data: { labels, datasets: bigDatasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { position: "bottom", labels: { color: "#EDEDEC", boxWidth: 12 } } },
      scales: {
        x: { ticks: { color: "#9B9EA6" }, grid: { color: "#2A2D34" } },
        y: { ticks: { color: "#9B9EA6" }, grid: { color: "#2A2D34" } },
      }
    }
  });
}

function renderFeed(entries){
  const feed = document.getElementById("feed");
  if(entries.length === 0){
    feed.innerHTML = `<div class="empty">Noch keine Einträge.</div>`;
    return;
  }
  const byId = {};
  PLAYERS.forEach(p=> byId[p.id] = p.name);
  const catLabel = {};
  CATEGORIES.forEach(c=> catLabel[c.id] = c.label);

  const sorted = [...entries].sort((a,b)=> new Date(b.created_at) - new Date(a.created_at));

  feed.innerHTML = sorted.slice(0, 25).map(e=>{
    const d = new Date(e.created_at);
    const time = d.toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit'}) + " " + d.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
    const catText = catLabel[e.category]||e.category;
    const cat = CATEGORIES.find(c=> c.id === e.category);
    const editBtn = cat && cat.type === "numeric" ? `<button class="edit-btn" onclick="openEditModal('${e.id}')" title="Bearbeiten">✎</button>` : "";
    return `<div class="feed-item">
      <div><span class="feed-name">${byId[e.player_id]||'?'}</span> <span class="feed-cat">${catText}</span></div>
      <div><span class="feed-pts">+${e.points}</span><span class="feed-time">${time}</span>${editBtn}<button class="del-btn" onclick="deleteEntry('${e.id}')" title="Löschen">×</button></div>
    </div>`;
  }).join("");
}

function buildMonthOptions(){
  const nowKey = monthKey(new Date());
  const keys = new Set([nowKey]);
  allEntries.forEach(e=> keys.add(monthKey(new Date(e.created_at))));
  const sorted = Array.from(keys).sort().reverse();

  const sel = document.getElementById("monthSelect");
  sel.innerHTML = sorted.map(k=>{
    const [y, m] = k.split("-").map(Number);
    const label = new Date(y, m-1, 1).toLocaleDateString('de-DE', {month:'long', year:'numeric'});
    return `<option value="${k}">${k === nowKey ? label + " (aktuell)" : label}</option>`;
  }).join("");
  sel.value = viewedMonthKey;
}

function onMonthSelect(){
  viewedMonthKey = document.getElementById("monthSelect").value;
  applyView();
}

function backToLive(){
  viewedMonthKey = monthKey(new Date());
  document.getElementById("monthSelect").value = viewedMonthKey;
  applyView();
}

function applyView(){
  const nowKey = monthKey(new Date());
  const isLive = viewedMonthKey === nowKey;
  const [y, m] = viewedMonthKey.split("-").map(Number);
  const viewedDate = new Date(y, m-1, 1);
  const viewedEntries = allEntries.filter(e=> monthKey(new Date(e.created_at)) === viewedMonthKey);
  lastViewedEntries = viewedEntries;
  lastViewedDate = viewedDate;
  lastViewedIsLive = isLive;

  currentMonthEntries = allEntries.filter(e=> monthKey(new Date(e.created_at)) === nowKey);

  document.getElementById("monthLabel").textContent =
    viewedDate.toLocaleDateString('de-DE', {month:'long', year:'numeric'}) + (isLive ? "" : " · Archiv");
  document.getElementById("chartTitle").textContent =
    isLive ? "Punkteverlauf diesen Monat" : "Punkteverlauf " + viewedDate.toLocaleDateString('de-DE', {month:'long', year:'numeric'});
  document.getElementById("logSection").style.display = isLive ? "" : "none";
  document.getElementById("archiveNotice").style.display = isLive ? "none" : "flex";

  renderBoard(viewedEntries, isLive);
  renderChart(viewedEntries, viewedDate, isLive);
  renderFeed(viewedEntries);
  renderCats();
  renderWallet();
  updateTicker();
  if(isLive) maybeCelebrateMonthWin();
}

async function loadAndRender(){
  const [entriesRes, spendsRes] = await Promise.all([
    sb.from("entries").select("*").order("created_at", {ascending:true}),
    sb.from("wallet_spends").select("*").order("created_at", {ascending:true}),
  ]);
  if(entriesRes.error){ console.error(entriesRes.error); return; }
  if(spendsRes.error){ console.error(spendsRes.error); }
  allEntries = entriesRes.data || [];
  allSpends = spendsRes.data || [];
  buildMonthOptions();
  applyView();
}

function subscribeRealtime(){
  sb.channel("live-updates")
    .on("postgres_changes", {event:"*", schema:"public", table:"entries"}, ()=> loadAndRender())
    .on("postgres_changes", {event:"*", schema:"public", table:"wallet_spends"}, ()=> loadAndRender())
    .subscribe();
}

async function init(){
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  viewedMonthKey = monthKey(new Date());

  renderWho();
  renderCats();
  await loadAndRender();
  subscribeRealtime();

  // Handys unterbrechen die Live-Verbindung im Hintergrund (Akku sparen).
  // Beim Zurückkommen wird zwar neu verbunden, aber verpasste Änderungen
  // kommen nicht automatisch nach — deshalb hier einmal frisch nachladen.
  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState === "visible") loadAndRender();
  });
  window.addEventListener("focus", ()=> loadAndRender());
  setInterval(updateTicker, 60000);
}

init();

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(err=> console.warn("SW-Registrierung fehlgeschlagen:", err));
  });
}
</script>
