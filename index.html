<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoreboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%86%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root{
    --bg:#16171A;
    --panel:#1E2025;
    --panel-2:#242730;
    --line:#33363E;
    --text:#EDEDEC;
    --text-dim:#9B9EA6;
    --blue:#4C6FFF;
    --gold:#E8B93F;
    --green:#3FBF7F;
    --red:#E2584D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:28px 20px 80px;
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:14px;
    gap:12px;
  }
  h1{
    font-family:'Archivo',sans-serif;
    font-weight:800;
    font-size:26px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .month-label{
    color:var(--text-dim);
    font-size:14px;
  }

  /* Month archive nav */
  .month-nav{
    display:flex;
    justify-content:flex-end;
    margin-bottom:18px;
  }
  .month-nav select{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    padding:8px 10px;
    font-size:13px;
    font-family:'Inter';
  }
  .archive-notice{
    background:var(--panel);
    border:1px solid var(--blue);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:20px;
    font-size:13px;
    color:var(--text-dim);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .archive-notice button{
    background:var(--blue);
    color:#fff;
    border:none;
    border-radius:6px;
    padding:7px 12px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }

  /* Player picker */
  #who{
    display:flex;
    gap:8px;
    margin-bottom:20px;
  }
  #who button{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    padding:10px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter';
  }
  #who button.active{
    border-color:var(--blue);
    background:var(--panel-2);
  }

  /* Scoreboard cards */
  .board{
    display:grid;
    grid-template-columns:repeat(3, minmax(0,1fr));
    gap:8px;
    margin-bottom:24px;
  }
  @media (max-width: 420px){
    .board{ gap:6px; }
    .card{ padding:12px 8px; }
    .p-score{ font-size:24px; }
    .p-name{ font-size:12px; }
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px 12px;
    position:relative;
    overflow:hidden;
  }
  .card.rank-1{border-color:var(--gold);}
  .rank-tag{
    font-size:11px;
    color:var(--text-dim);
    margin-bottom:6px;
  }
  .card.rank-1 .rank-tag{color:var(--gold);}
  .p-name{
    font-size:14px;
    font-weight:600;
    margin-bottom:8px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .p-score{
    font-family:'Archivo',sans-serif;
    font-weight:800;
    font-size:32px;
    line-height:1;
    letter-spacing:-0.02em;
  }
  .p-score .unit{font-size:13px;color:var(--text-dim);font-family:'Inter';font-weight:500;margin-left:3px;}
  .p-meta{
    margin-top:8px;
    font-size:12px;
    color:var(--text-dim);
    display:flex;
    align-items:center;
    gap:4px;
  }
  .p-gap{
    margin-top:8px;
    font-size:12px;
    color:var(--text-dim);
  }
  .rank-arrow{
    font-size:11px;
    margin-left:4px;
  }
  .rank-arrow.up{color:var(--green);}
  .rank-arrow.down{color:var(--red);}
  .streak-risk{color:var(--gold);}
  @keyframes leaderFlash{
    0%{ box-shadow:0 0 0 0 rgba(232,185,63,0.6); }
    100%{ box-shadow:0 0 0 14px rgba(232,185,63,0); }
  }
  .card.rank-1.flash{ animation: leaderFlash 0.9s ease-out; }

  /* Chart */
  section.chart{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    margin-bottom:24px;
  }
  section.chart h2{
    font-size:14px;
    font-weight:600;
    margin:0 0 12px;
    color:var(--text-dim);
  }
  section.chart canvas{max-height:220px;}

  /* Stakes banner */
  .stakes{
    background:var(--panel);
    border:1px solid var(--gold);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:24px;
    font-size:13px;
    color:var(--text-dim);
    line-height:1.5;
  }
  .stakes strong{color:var(--gold);}

  /* Wallet */
  section.wallet{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    margin-bottom:24px;
  }
  section.wallet h2{
    font-size:14px;
    font-weight:600;
    margin:0 0 12px;
    color:var(--text-dim);
  }
  .wallet-cards{
    display:grid;
    grid-template-columns:repeat(3, minmax(0,1fr));
    gap:8px;
    margin-bottom:6px;
  }
  @media (max-width: 420px){
    .wallet-cards{ grid-template-columns:1fr; }
  }
  .wallet-card{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px;
  }
  .wallet-name{font-size:12px;color:var(--text-dim);margin-bottom:4px;}
  .wallet-bal{
    font-family:'Archivo',sans-serif;
    font-weight:800;
    font-size:20px;
    margin-bottom:8px;
  }
  .wallet-bal.neg{color:var(--red);}
  .wallet-spend-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--text-dim);
    border-radius:6px;
    padding:6px 10px;
    font-size:12px;
    cursor:pointer;
    width:100%;
  }
  .spend-form{
    display:none;
    flex-direction:column;
    gap:6px;
    margin-top:8px;
  }
  .spend-form input{
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:6px;
    padding:7px 8px;
    font-size:12px;
    font-family:'Inter';
  }
  .spend-form button{
    background:var(--blue);
    color:#fff;
    border:none;
    border-radius:6px;
    padding:7px 10px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
  }

  /* Log entry */
  section.log{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    margin-bottom:20px;
  }
  section.log h2{
    font-size:14px;
    font-weight:600;
    margin:0 0 12px;
  }
  .cats{
    display:grid;
    grid-template-columns:1fr;
    gap:8px;
  }
  .cat-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:11px 12px;
    cursor:pointer;
    color:var(--text);
    font-family:'Inter';
    font-size:13px;
    font-weight:500;
    text-align:left;
  }
  .cat-btn:active{border-color:var(--blue);}
  .cat-btn.done{opacity:0.45;cursor:default;}
  .cat-btn.numeric{cursor:default;flex-wrap:wrap;gap:8px;}
  .numeric-input{display:flex;gap:6px;}
  .numeric-input input{
    width:78px;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:6px;
    padding:6px 8px;
    font-size:13px;
    font-family:'Inter';
  }
  .numeric-input button{
    background:var(--blue);
    color:#fff;
    border:none;
    border-radius:6px;
    padding:6px 10px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
  }
  .numeric-input button:disabled{opacity:0.4;cursor:default;}
  .cat-pts{
    color:var(--green);
    font-weight:700;
    font-size:13px;
  }
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--green);
    color:#0d1a12;
    padding:10px 18px;
    border-radius:20px;
    font-size:13px;
    font-weight:600;
    opacity:0;
    transition:opacity .2s, transform .2s;
    pointer-events:none;
    z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* Feed */
  section.feed h2{
    font-size:14px;
    font-weight:600;
    margin:0 0 10px;
    color:var(--text-dim);
  }
  .feed-item{
    display:flex;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .feed-item:last-child{border-bottom:none;}
  .feed-name{font-weight:600;}
  .feed-cat{color:var(--text-dim);}
  .feed-pts{color:var(--green);font-weight:700;}
  .feed-pts.neg{color:var(--red);}
  .feed-time{color:var(--text-dim);font-size:12px;margin-left:8px;}
  .del-btn{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:16px;
    cursor:pointer;
    margin-left:8px;
    padding:0 4px;
    line-height:1;
  }
  .del-btn:hover{color:var(--red);}
  .empty{color:var(--text-dim);font-size:13px;padding:16px 0;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Scoreboard</h1>
    <div class="month-label" id="monthLabel"></div>
  </header>

  <div class="month-nav">
    <select id="monthSelect" onchange="onMonthSelect()"></select>
  </div>

  <div class="archive-notice" id="archiveNotice" style="display:none">
    <span>Du siehst einen vergangenen Monat an (nur Ansicht).</span>
    <button onclick="backToLive()">Zurück zu heute</button>
  </div>

  <div id="who"></div>

  <div class="board" id="board"></div>

  <section class="chart">
    <h2 id="chartTitle">Punkteverlauf</h2>
    <canvas id="trendChart"></canvas>
  </section>

  <div class="stakes" id="stakesBanner"></div>

  <section class="log" id="logSection">
    <h2>Punkte eintragen</h2>
    <div class="cats" id="cats"></div>
  </section>

  <section class="wallet">
    <h2>Guthaben</h2>
    <div class="wallet-cards" id="walletCards"></div>
    <div id="walletLog"></div>
  </section>

  <section class="feed">
    <h2>Letzte Einträge</h2>
    <div id="feed"></div>
  </section>

</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   KONFIGURATION — hier alles auf euch drei anpassen
   ============================================================ */

// Eure 3 Spieler: id = intern, name = Anzeigename
const PLAYERS = [
  { id: "p1", name: "Tammo" },
  { id: "p2", name: "Joshua" },
  { id: "p3", name: "Lennart" },
];

// Kategorien: "flat" = fester Punktwert pro Klick, "numeric" = Zahl eingeben.
// "limit": "day" = max. 1x pro Tag, "week-sunday" = nur sonntags, max. 1x pro Woche.
const CATEGORIES = [
  { id: "bett",               label: "Bett gemacht",                                  type: "flat",    points: 1,  limit: "day" },
  { id: "cardio",              label: "Cardio",                                        type: "numeric", unitLabel: "Minuten", unitSize: 10, pointsPerUnit: 10 },
  { id: "sport",                label: "Sport",                                        type: "flat",    points: 50 },
  { id: "dehnen",                label: "Dehnen",                                       type: "flat",    points: 20, limit: "day" },
  { id: "schritte",               label: "Schritte (in Tausend, z.B. 3 = 3.000)",         type: "numeric", unitLabel: "Tausend", unitSize: 1, pointsPerUnit: 1, displayMultiplier: 1000, displayUnitLabel: "Schritte" },
  { id: "lesen",                   label: "Lesen",                                       type: "numeric", unitLabel: "Minuten", unitSize: 10, pointsPerUnit: 10 },
  { id: "screentime_besser",        label: "Social Media: 30 Min weniger als letzte Woche", type: "flat",  points: 10, limit: "week-sunday" },
  { id: "screentime_ziel",          label: "Social-Media-Wochenschnitt unter 2h",          type: "flat",  points: 50, limit: "week-sunday" },
];

// Preis, den der Monatssieger insgesamt bekommt (von den beiden anderen zusammen)
const MONTHLY_PRIZE_EUR = 15;

// Fest eingetragene Supabase-Zugangsdaten (Publishable Key ist bewusst öffentlich nutzbar)
const SUPABASE_URL = "https://dswuwwmkrjwhyzbnyvvi.supabase.co";
const SUPABASE_KEY = "sb_publishable_tGL-gO7-zsiQw5jwyzeUEA_ef_Cduao";

/* ============================================================
   Ab hier nichts mehr anfassen
   ============================================================ */

let sb = null;
let currentPlayer = localStorage.getItem("sb_current_player") || null;
let allEntries = [];       // alle Punkte-Einträge, aller Monate
let allSpends = [];        // alle Wallet-Ausgaben, aller Monate
let currentMonthEntries = []; // nur der ECHTE aktuelle Monat (für Sperr-Logik beim Eintragen)
let viewedMonthKey = null; // welcher Monat wird gerade angezeigt (Archiv oder aktuell)
let trendChart = null;
let previousRanks = {};    // nur für die Live-Ansicht (Rang-Pfeile)

function pad2(n){ return String(n).padStart(2, "0"); }

function monthKey(d){
  return d.getFullYear() + "-" + pad2(d.getMonth()+1);
}

function dateKey(d){
  return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
}

function daysInMonthOf(year, monthIndex0){
  return new Date(year, monthIndex0+1, 0).getDate();
}

function formatEuro(v){
  const sign = v < 0 ? "-" : "";
  return sign + Math.abs(v).toLocaleString('de-DE', {minimumFractionDigits:2, maximumFractionDigits:2}) + " €";
}

// Streak = Anzahl aufeinanderfolgender Tage mit mindestens einem Eintrag,
// über ALLE Monate hinweg (damit die Streak am Monatswechsel nicht fälschlich abreißt).
// Wenn heute noch nichts eingetragen wurde, zählt die Streak trotzdem ab
// gestern weiter (sie ist ja bis Mitternacht noch "am Leben"), wird aber
// als "atRisk" markiert.
function computeStreak(playerId, entriesAllTime){
  const days = new Set(
    entriesAllTime.filter(e=> e.player_id === playerId).map(e=> dateKey(new Date(e.created_at)))
  );
  const today = new Date();
  const atRisk = !days.has(dateKey(today));
  const cursor = new Date(today);
  if(atRisk) cursor.setDate(cursor.getDate()-1);
  let streak = 0;
  while(days.has(dateKey(cursor))){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return { count: streak, atRisk: atRisk && streak > 0 };
}

function dayBounds(){
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const end = new Date(start); end.setDate(end.getDate()+1);
  return {start, end};
}

function weekBounds(){
  const now = new Date();
  const dow = (now.getDay() + 6) % 7; // Montag = 0
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow);
  const end = new Date(start); end.setDate(end.getDate()+7);
  return {start, end};
}

function isSunday(){
  return new Date().getDay() === 0;
}

// Für Kategorien mit "limit": prüft ob heute/diese Woche schon geloggt wurde,
// bzw. ob heute überhaupt der richtige Tag dafür ist ("week-sunday").
function categoryLockState(cat){
  if(!cat.limit || !currentPlayer) return { locked: false };

  if(cat.limit === "day"){
    const {start, end} = dayBounds();
    const done = currentMonthEntries.some(e=>
      e.player_id === currentPlayer && e.category === cat.id &&
      new Date(e.created_at) >= start && new Date(e.created_at) < end
    );
    return done ? { locked: true, reason: "heute schon erledigt" } : { locked: false };
  }

  if(cat.limit === "week-sunday"){
    if(!isSunday()) return { locked: true, reason: "nur sonntags" };
    const {start, end} = weekBounds();
    const done = currentMonthEntries.some(e=>
      e.player_id === currentPlayer && e.category === cat.id &&
      new Date(e.created_at) >= start && new Date(e.created_at) < end
    );
    return done ? { locked: true, reason: "diese Woche schon erledigt" } : { locked: false };
  }

  return { locked: false };
}

// Ermittelt Sieger eines Monats aus einer Liste von Einträgen (nur dieser Monat).
// Bei Gleichstand an der Spitze gibt es keinen eindeutigen Sieger.
function monthWinner(monthEntries){
  const totals = {};
  PLAYERS.forEach(p=> totals[p.id] = 0);
  monthEntries.forEach(e=> totals[e.player_id] = (totals[e.player_id]||0) + e.points);
  const max = Math.max(...PLAYERS.map(p=> totals[p.id]));
  if(max <= 0) return { winner: null, tie: false, totals };
  const topPlayers = PLAYERS.filter(p=> totals[p.id] === max);
  return topPlayers.length === 1
    ? { winner: topPlayers[0], tie: false, totals }
    : { winner: null, tie: true, totals };
}

// Guthaben je Spieler: +15€ für jeden abgeschlossenen Monat, den er gewonnen hat,
// minus alles, was er/sie über "Ausgeben" bereits abgezogen hat.
function computeWallets(){
  const balances = {};
  PLAYERS.forEach(p=> balances[p.id] = 0);
  const nowKey = monthKey(new Date());
  const monthsSeen = new Set(allEntries.map(e=> monthKey(new Date(e.created_at))));
  monthsSeen.forEach(mk=>{
    if(mk === nowKey) return; // laufender Monat ist noch nicht abgeschlossen
    const monthEntries = allEntries.filter(e=> monthKey(new Date(e.created_at)) === mk);
    const { winner } = monthWinner(monthEntries);
    if(winner) balances[winner.id] += MONTHLY_PRIZE_EUR;
  });
  allSpends.forEach(s=>{
    if(balances[s.player_id] !== undefined) balances[s.player_id] -= Number(s.amount);
  });
  return balances;
}

function renderWho(){
  const el = document.getElementById("who");
  el.innerHTML = "";
  PLAYERS.forEach(p=>{
    const btn = document.createElement("button");
    btn.textContent = p.name;
    if(p.id === currentPlayer) btn.classList.add("active");
    btn.onclick = ()=>{
      currentPlayer = p.id;
      localStorage.setItem("sb_current_player", p.id);
      renderWho();
      renderCats();
    };
    el.appendChild(btn);
  });
}

function renderCats(){
  const el = document.getElementById("cats");
  el.innerHTML = "";
  CATEGORIES.forEach(c=>{
    if(c.type === "flat"){
      const lock = categoryLockState(c);
      const btn = document.createElement("button");
      btn.className = "cat-btn" + (lock.locked ? " done" : "");
      btn.disabled = lock.locked;
      btn.innerHTML = `<span>${c.label}${lock.locked ? " · " + lock.reason : ""}</span><span class="cat-pts">+${c.points}</span>`;
      btn.onclick = ()=> logFlat(c);
      el.appendChild(btn);
    } else {
      const row = document.createElement("div");
      row.className = "cat-btn numeric";
      row.innerHTML = `
        <span>${c.label}</span>
        <span class="numeric-input">
          <input type="number" min="0" step="1" placeholder="${c.unitLabel}" id="input-${c.id}">
          <button onclick="logNumeric('${c.id}')">Eintragen</button>
        </span>`;
      el.appendChild(row);
    }
  });
}

async function logFlat(cat){
  if(!currentPlayer){ alert("Wähl oben erst deinen Namen aus."); return; }
  const lock = categoryLockState(cat);
  if(lock.locked){ alert("Geht gerade nicht: " + lock.reason + "."); return; }
  await insertEntry(cat.id, cat.points, `+${cat.points} für ${cat.label}`);
}

async function logNumeric(catId){
  const cat = CATEGORIES.find(c=> c.id === catId);
  if(!currentPlayer){ alert("Wähl oben erst deinen Namen aus."); return; }
  const input = document.getElementById("input-"+catId);
  const value = parseFloat((input.value || "").replace(",", "."));
  if(!value || value <= 0){ alert("Trag zuerst eine Zahl ein."); return; }
  const points = Math.floor(value / cat.unitSize) * cat.pointsPerUnit;
  if(points <= 0){ alert(`Das sind noch keine ${cat.unitSize} ${cat.unitLabel} — noch keine Punkte.`); return; }
  const multiplier = cat.displayMultiplier || 1;
  const displayValue = value * multiplier;
  const displayUnit = cat.displayUnitLabel || cat.unitLabel;
  await insertEntry(cat.id, points, `+${points} für ${displayValue.toLocaleString('de-DE')} ${displayUnit}`, displayValue);
  input.value = "";
}

async function insertEntry(categoryId, points, toastMsg, rawValue){
  const { error } = await sb.from("entries").insert({
    player_id: currentPlayer,
    category: categoryId,
    points: points,
    raw_value: rawValue ?? null
  });
  if(error){ alert("Fehler beim Speichern: " + error.message); return; }
  showToast(toastMsg);
}

async function deleteEntry(id){
  if(!confirm("Diesen Eintrag wirklich löschen?")) return;
  const { error } = await sb.from("entries").delete().eq("id", id);
  if(error){ alert("Fehler beim Löschen: " + error.message); }
}

function toggleSpendForm(playerId){
  const form = document.getElementById("spend-form-"+playerId);
  form.style.display = form.style.display === "flex" ? "none" : "flex";
}

async function spendMoney(playerId){
  const amountInput = document.getElementById("spend-amount-"+playerId);
  const noteInput = document.getElementById("spend-note-"+playerId);
  const amount = parseFloat((amountInput.value || "").replace(",", "."));
  if(!amount || amount <= 0){ alert("Trag einen gültigen Betrag ein."); return; }
  const { error } = await sb.from("wallet_spends").insert({
    player_id: playerId,
    amount: amount,
    note: noteInput.value || null
  });
  if(error){ alert("Fehler beim Speichern: " + error.message); return; }
  amountInput.value = "";
  noteInput.value = "";
  document.getElementById("spend-form-"+playerId).style.display = "none";
  showToast("Ausgegeben: " + formatEuro(amount));
}

async function deleteSpend(id){
  if(!confirm("Diese Ausgabe wirklich löschen?")) return;
  const { error } = await sb.from("wallet_spends").delete().eq("id", id);
  if(error){ alert("Fehler beim Löschen: " + error.message); }
}

function renderWallet(){
  const balances = computeWallets();
  const byId = {}; PLAYERS.forEach(p=> byId[p.id] = p.name);

  const cardsEl = document.getElementById("walletCards");
  cardsEl.innerHTML = PLAYERS.map(p=>{
    const bal = balances[p.id] || 0;
    return `<div class="wallet-card">
      <div class="wallet-name">${p.name}</div>
      <div class="wallet-bal${bal < 0 ? " neg" : ""}">${formatEuro(bal)}</div>
      <button class="wallet-spend-btn" onclick="toggleSpendForm('${p.id}')">Ausgeben</button>
      <div class="spend-form" id="spend-form-${p.id}">
        <input type="number" step="0.01" min="0" placeholder="€ Betrag" id="spend-amount-${p.id}">
        <input type="text" placeholder="Wofür? (optional)" id="spend-note-${p.id}">
        <button onclick="spendMoney('${p.id}')">Bestätigen</button>
      </div>
    </div>`;
  }).join("");

  const logEl = document.getElementById("walletLog");
  if(allSpends.length === 0){
    logEl.innerHTML = `<div class="empty">Noch nichts ausgegeben.</div>`;
    return;
  }
  const sorted = [...allSpends].sort((a,b)=> new Date(b.created_at) - new Date(a.created_at));
  logEl.innerHTML = sorted.slice(0, 15).map(s=>{
    const d = new Date(s.created_at);
    const time = d.toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit'});
    return `<div class="feed-item">
      <div><span class="feed-name">${byId[s.player_id]||'?'}</span> <span class="feed-cat">${s.note || 'Ausgegeben'}</span></div>
      <div><span class="feed-pts neg">-${formatEuro(s.amount).replace('-','')}</span><span class="feed-time">${time}</span><button class="del-btn" onclick="deleteSpend('${s.id}')" title="Löschen">×</button></div>
    </div>`;
  }).join("");
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=> t.classList.remove("show"), 1800);
}

function renderBoard(entries, isLive){
  const totals = {};
  PLAYERS.forEach(p=> totals[p.id] = 0);
  entries.forEach(e=> totals[e.player_id] = (totals[e.player_id]||0) + e.points);

  const ranked = PLAYERS.map(p=>({
    ...p,
    pts: totals[p.id] || 0,
    streak: isLive ? computeStreak(p.id, allEntries) : null,
  })).sort((a,b)=> b.pts - a.pts);

  const topScore = ranked[0].pts;
  const tiedAtTop = topScore > 0 && ranked.filter(p=> p.pts === topScore).length > 1;

  let newLeaderChanged = false;
  if(isLive){
    const previousLeader = Object.keys(previousRanks).find(id=> previousRanks[id] === 0);
    newLeaderChanged = !!previousLeader && previousLeader !== ranked[0].id && topScore > 0 && !tiedAtTop;
  }

  const board = document.getElementById("board");
  board.innerHTML = "";
  ranked.forEach((p, i)=>{
    const card = document.createElement("div");
    const isSoleLeader = i === 0 && p.pts > 0 && !tiedAtTop;
    card.className = "card" + (isSoleLeader ? " rank-1" : "") + (isSoleLeader && newLeaderChanged ? " flash" : "");

    let extraHtml = "";
    if(isLive){
      let arrowHtml = "";
      if(previousRanks[p.id] !== undefined && previousRanks[p.id] !== i){
        arrowHtml = previousRanks[p.id] > i
          ? `<span class="rank-arrow up">▲</span>`
          : `<span class="rank-arrow down">▼</span>`;
      }
      const streakHtml = p.streak && p.streak.count > 0
        ? `<div class="p-meta${p.streak.atRisk ? " streak-risk" : ""}">🔥 ${p.streak.count} Tage Streak${p.streak.atRisk ? " · heute noch retten!" : ""}</div>`
        : "";
      const gapHtml = i > 0 && topScore > 0 ? `<div class="p-gap">${topScore - p.pts} Pkt bis Platz 1</div>` : "";
      card.dataset.arrow = arrowHtml;
      extraHtml = streakHtml + gapHtml;
      card.innerHTML = `
        <div class="rank-tag">${i===0 ? "1. Platz" : (i+1)+". Platz"}${arrowHtml}</div>
        <div class="p-name">${p.name}</div>
        <div class="p-score">${p.pts}<span class="unit">Pkt</span></div>
        ${extraHtml}
      `;
    } else {
      const winnerTag = isSoleLeader ? `<div class="p-meta">🏆 Gewinner</div>` : "";
      card.innerHTML = `
        <div class="rank-tag">${i===0 ? "1. Platz" : (i+1)+". Platz"}</div>
        <div class="p-name">${p.name}</div>
        <div class="p-score">${p.pts}<span class="unit">Pkt</span></div>
        ${winnerTag}
      `;
    }
    board.appendChild(card);
  });

  if(isLive){
    previousRanks = {};
    ranked.forEach((p, i)=> previousRanks[p.id] = i);
  }

  const banner = document.getElementById("stakesBanner");
  if(isLive){
    if(tiedAtTop){
      const names = ranked.filter(p=> p.pts === topScore).map(p=> p.name).join(" & ");
      banner.innerHTML = `Gleichstand an der Spitze zwischen <strong>${names}</strong> — noch ist alles offen für die ${MONTHLY_PRIZE_EUR}€.`;
    } else if(topScore > 0){
      banner.innerHTML = `<strong>${ranked[0].name}</strong> liegt aktuell vorn und würde am Monatsende insgesamt ${MONTHLY_PRIZE_EUR}€ von den beiden anderen zusammen bekommen.`;
    } else {
      banner.innerHTML = `Noch keine Einträge diesen Monat. Wer am Ende vorn liegt, bekommt insgesamt ${MONTHLY_PRIZE_EUR}€ von den beiden anderen zusammen.`;
    }
  } else {
    if(tiedAtTop){
      const names = ranked.filter(p=> p.pts === topScore).map(p=> p.name).join(" & ");
      banner.innerHTML = `In diesem Monat gab es einen Gleichstand zwischen <strong>${names}</strong> — die ${MONTHLY_PRIZE_EUR}€ wurden deshalb nicht automatisch vergeben. Klärt das unter euch.`;
    } else if(topScore > 0){
      banner.innerHTML = `<strong>${ranked[0].name}</strong> war Sieger dieses Monats mit ${topScore} Punkten und hat ${MONTHLY_PRIZE_EUR}€ von den beiden anderen zusammen bekommen.`;
    } else {
      banner.innerHTML = `In diesem Monat gab es keine Einträge.`;
    }
  }
}

function renderChart(entries, viewedDate, isLive){
  const daysInMonth = isLive ? new Date().getDate() : daysInMonthOf(viewedDate.getFullYear(), viewedDate.getMonth());
  const labels = Array.from({length: daysInMonth}, (_, i)=> i+1);
  const colors = { p1: "#4C6FFF", p2: "#E8B93F", p3: "#3FBF7F" };

  const datasets = PLAYERS.map(p=>{
    const dailyTotals = new Array(daysInMonth).fill(0);
    entries.forEach(e=>{
      if(e.player_id !== p.id) return;
      const day = new Date(e.created_at).getDate();
      if(day <= daysInMonth) dailyTotals[day-1] += e.points;
    });
    let running = 0;
    const cumulative = dailyTotals.map(v=> running += v);
    return {
      label: p.name,
      data: cumulative,
      borderColor: colors[p.id] || "#9B9EA6",
      backgroundColor: "transparent",
      tension: 0.25,
      pointRadius: 2,
    };
  });

  const ctx = document.getElementById("trendChart");
  if(trendChart) trendChart.destroy();
  trendChart = new Chart(ctx, {
    type: "line",
    data: { labels, datasets },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: "#EDEDEC" } } },
      scales: {
        x: { ticks: { color: "#9B9EA6" }, grid: { color: "#2A2D34" } },
        y: { ticks: { color: "#9B9EA6" }, grid: { color: "#2A2D34" } },
      }
    }
  });
}

function renderFeed(entries){
  const feed = document.getElementById("feed");
  if(entries.length === 0){
    feed.innerHTML = `<div class="empty">Noch keine Einträge.</div>`;
    return;
  }
  const byId = {};
  PLAYERS.forEach(p=> byId[p.id] = p.name);
  const catLabel = {};
  CATEGORIES.forEach(c=> catLabel[c.id] = c.label);

  const sorted = [...entries].sort((a,b)=> new Date(b.created_at) - new Date(a.created_at));

  feed.innerHTML = sorted.slice(0, 25).map(e=>{
    const d = new Date(e.created_at);
    const time = d.toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit'}) + " " + d.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
    const catText = catLabel[e.category]||e.category;
    return `<div class="feed-item">
      <div><span class="feed-name">${byId[e.player_id]||'?'}</span> <span class="feed-cat">${catText}</span></div>
      <div><span class="feed-pts">+${e.points}</span><span class="feed-time">${time}</span><button class="del-btn" onclick="deleteEntry('${e.id}')" title="Löschen">×</button></div>
    </div>`;
  }).join("");
}

function buildMonthOptions(){
  const nowKey = monthKey(new Date());
  const keys = new Set([nowKey]);
  allEntries.forEach(e=> keys.add(monthKey(new Date(e.created_at))));
  const sorted = Array.from(keys).sort().reverse();

  const sel = document.getElementById("monthSelect");
  sel.innerHTML = sorted.map(k=>{
    const [y, m] = k.split("-").map(Number);
    const label = new Date(y, m-1, 1).toLocaleDateString('de-DE', {month:'long', year:'numeric'});
    return `<option value="${k}">${k === nowKey ? label + " (aktuell)" : label}</option>`;
  }).join("");
  sel.value = viewedMonthKey;
}

function onMonthSelect(){
  viewedMonthKey = document.getElementById("monthSelect").value;
  applyView();
}

function backToLive(){
  viewedMonthKey = monthKey(new Date());
  document.getElementById("monthSelect").value = viewedMonthKey;
  applyView();
}

function applyView(){
  const nowKey = monthKey(new Date());
  const isLive = viewedMonthKey === nowKey;
  const [y, m] = viewedMonthKey.split("-").map(Number);
  const viewedDate = new Date(y, m-1, 1);
  const viewedEntries = allEntries.filter(e=> monthKey(new Date(e.created_at)) === viewedMonthKey);

  currentMonthEntries = allEntries.filter(e=> monthKey(new Date(e.created_at)) === nowKey);

  document.getElementById("monthLabel").textContent =
    viewedDate.toLocaleDateString('de-DE', {month:'long', year:'numeric'}) + (isLive ? "" : " · Archiv");
  document.getElementById("chartTitle").textContent =
    isLive ? "Punkteverlauf diesen Monat" : "Punkteverlauf " + viewedDate.toLocaleDateString('de-DE', {month:'long', year:'numeric'});
  document.getElementById("logSection").style.display = isLive ? "" : "none";
  document.getElementById("archiveNotice").style.display = isLive ? "none" : "flex";

  renderBoard(viewedEntries, isLive);
  renderChart(viewedEntries, viewedDate, isLive);
  renderFeed(viewedEntries);
  renderCats();
  renderWallet();
}

async function loadAndRender(){
  const [entriesRes, spendsRes] = await Promise.all([
    sb.from("entries").select("*").order("created_at", {ascending:true}),
    sb.from("wallet_spends").select("*").order("created_at", {ascending:true}),
  ]);
  if(entriesRes.error){ console.error(entriesRes.error); return; }
  if(spendsRes.error){ console.error(spendsRes.error); }
  allEntries = entriesRes.data || [];
  allSpends = spendsRes.data || [];
  buildMonthOptions();
  applyView();
}

function subscribeRealtime(){
  sb.channel("live-updates")
    .on("postgres_changes", {event:"*", schema:"public", table:"entries"}, ()=> loadAndRender())
    .on("postgres_changes", {event:"*", schema:"public", table:"wallet_spends"}, ()=> loadAndRender())
    .subscribe();
}

async function init(){
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  viewedMonthKey = monthKey(new Date());

  renderWho();
  renderCats();
  await loadAndRender();
  subscribeRealtime();
}

init();
</script>
